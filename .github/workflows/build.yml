# Maden - GitHub Actions ile Android APK (Godot 4.7.2 .NET, gradle yolu). Gizli anahtar gerekmez:
# APK, çalışma sırasında üretilen debug anahtarıyla imzalanır. Çıktı: "Maden-apk" artifact'i.
name: APK derle

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.7.2"
  GODOT_DIR: ${{ github.workspace }}/.godot-bin

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Çekirdek testleri (xUnit)
        run: dotnet test Core.Tests --nologo

      - name: Denge simülasyonu
        run: dotnet run --project Sim -c Release -- --seeds 3

      - name: Godot ve dışa aktarım şablonlarını indir
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$GODOT_DIR"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip -d "$GODOT_DIR"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q templates.tpz -d tpl
          mv tpl/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          chmod +x "$GODOT_DIR/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"

      - name: APK derle
        run: |
          export GODOT="$GODOT_DIR/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          export DOTNET_ROOT="$(dirname "$(readlink -f "$(which dotnet)")")"
          export JAVA_HOME="${JAVA_HOME:-$JAVA_HOME_17_X64}"
          tools/build_android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Maden-apk
          path: Builds/Maden.apk
          if-no-files-found: error
